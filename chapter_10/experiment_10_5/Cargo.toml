[package]
name = "multi-omics-integration"
version = "0.5.0"
edition = "2021"
authors = ["Multi-Omics Analysis Team"]
description = "Comprehensive multi-omics integration pipeline for genomic data analysis"

[[bin]]
name = "integrate"
path = "src/main.rs"

[[bin]]
name = "coverage_calc"
path = "src/coverage_calc.rs"

[[bin]]
name = "expression_processor"
path = "src/expression_processor.rs"

[[bin]]
name = "correlation_analyzer"
path = "src/correlation_analyzer.rs"

[[bin]]
name = "network_builder"
path = "src/network_builder.rs"

[dependencies]
rust-htslib = "0.46"
rayon = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"
bio = "1.6"
itertools = "0.12"
statrs = "0.16"
ndarray = { version = "0.15", features = ["serde"] }
ndarray-stats = "0.5"
ndarray-linalg = "0.16"
linfa = "0.7"
linfa-clustering = "0.7"
dashmap = "5.5"
crossbeam = "0.8"
indicatif = "0.17"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1.0"
csv = "1.3"
regex = "1.10"
petgraph = "0.6"
plotly = { version = "0.8", features = ["kaleido"] }
polars = { version = "0.35", features = ["lazy", "csv", "json", "strings", "dtype-datetime"] }

[dev-dependencies]
tempfile = "3.0"
criterion = "0.5"
approx = "0.5"

[[bench]]
name = "integration_benchmarks"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false

[profile.dev]
opt-level = 1
debug = true

[features]
default = ["advanced-stats", "network-analysis"]
advanced-stats = ["ndarray-linalg", "linfa"]
network-analysis = ["petgraph"]
visualization = ["plotly"]
