[package]
name = "bam-coverage-calculator"
version = "0.1.0"
edition = "2021"
authors = ["Bioinformatics Developer"]
description = "Efficient BAM file coverage track calculator"

[[bin]]
name = "bam_coverage"
path = "src/main.rs"

[dependencies]
rust-htslib = "0.44"
rayon = "1.8"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"

[dev-dependencies]
tempfile = "3.8"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
