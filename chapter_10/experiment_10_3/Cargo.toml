[package]
name = "signal-normalization-qc"
version = "0.3.0"
edition = "2021"
authors = ["Epigenomic QC Team"]
description = "Comprehensive signal normalization and quality control for epigenomic data"

[[bin]]
name = "rust_qc"
path = "src/main.rs"

[[bin]]
name = "rust_peak_caller"
path = "src/peak_caller.rs"

[[bin]]
name = "signal_normalizer"
path = "src/normalizer.rs"

[dependencies]
rust-htslib = "0.46"
rayon = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"
bio = "1.6"
itertools = "0.12"
statrs = "0.16"
dashmap = "5.5"
crossbeam = "0.8"
indicatif = "0.17"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1.0"
csv = "1.3"
regex = "1.10"
ndarray = "0.15"
plotly = { version = "0.8", features = ["kaleido"] }

[dev-dependencies]
tempfile = "3.0"
criterion = "0.5"
approx = "0.5"

[[bench]]
name = "qc_benchmarks"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
