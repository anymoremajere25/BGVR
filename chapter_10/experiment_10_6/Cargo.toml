[package]
name = "epigenomic-hmm-segmentation"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rayon = "1.7"
clap = { version = "4.0", features = ["derive"] }
ndarray = "0.15"
statrs = "0.16"
csv = "1.2"
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"

[[bin]]
name = "main"
path = "src/main.rs"
