[package]
name = "interval-peak-caller"
version = "0.2.0"
edition = "2021"
authors = ["Epigenomic Pipeline Team"]
description = "Robust interval tree-based peak caller for epigenomic data"

[[bin]]
name = "rust_peak_caller"
path = "src/main.rs"

[dependencies]
rust-htslib = "0.46"
rayon = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"
bio = "1.6"
itertools = "0.12"
statrs = "0.16"
dashmap = "5.5"
crossbeam = "0.8"
indicatif = "0.17"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1.0"
csv = "1.3"

[dev-dependencies]
tempfile = "3.0"
criterion = "0.5"

[[bench]]
name = "interval_benchmarks"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
